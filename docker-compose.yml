services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tanvinhdat-web:latest
    container_name: tanvinhdat-web
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_ROLE: ${ADMIN_ROLE:-owner}
      ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-28800}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      GOOGLE_SHEET_URL: ${GOOGLE_SHEET_URL}
      NEXT_PUBLIC_CONTACT_WEBHOOK_URL: ${NEXT_PUBLIC_CONTACT_WEBHOOK_URL}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
